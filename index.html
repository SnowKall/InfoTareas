<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfoTareas</title>

    <!-- Conexión a los archivos CSS -->
    <link rel="stylesheet" href="CSS/main.css">
    <link rel="stylesheet" href="CSS/componentes.css">
    <link rel="stylesheet" href="CSS/views.css">

    <!-- Conexión al Manifesto PWA-->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
</head>
<body>

    <!-- Pantalla Principal / Vista de Tareas-->
    <section id="view-tasks" class="view active">
        <!-- Barra Superior: Buscador y Botón Agregar -->
        <header class="top-bar">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" placeholder="Buscar tarea o curso...">
            </div>
            <button id="btn-add-task" class="btn-icon-add">+</button>
        </header>

        <!-- Filtros Rápidos -->
            <div class="filter-tabs">
                <button class="filter-btn active" data-filter="all">Todas</button>
                <button class="filter-btn" data-filter="today">Hoy</button>
                <button class="filter-btn" data-filter="week">Esta semana</button>
            </div>

        <!-- Lista de Tareas (Tarjetas) -->
        <main class="tasks-container" id="tasks-list">
            <!-- Ejemplo de tarjeta como la dibujaste -->
            <article class="task-card">
                <div class="task-icon">📝</div>
                <div class="task-info">
                <h3 class="task-title">Informe de Matrices</h3>
                <p class="task-course">Matemática Discreta</p>
                <div class="task-badges">
                    <span class="badge badge-group">Grupal</span>
                    <span class="badge badge-date">Mañana, 11:59 PM</span>
                </div>
                </div>
                <div class="task-action">
                <input type="checkbox" class="task-check">
                </div>
            </article>
        </main>
    </section>

    <!-- Pantalla 2 : Creación de Tareas (Oculta x defecto)-->
    <section id="view-add-task" class="view hidden">
        <header class="top-bar-sub">
        <button id="btn-back-task" class="btn-back">←</button>
        <h2>Agregar Tarea</h2>
        </header>
            <form id="form-task" class="form-container">
                <input type="text" placeholder="Título de la tarea" required>
                <select required>
                    <option value="" disabled selected>Selecciona un curso</option>
                </select>
                <div class="type-selector">
                    <button type="button" class="btn-toggle active">Individual</button>
                    <button type="button" class="btn-toggle">Grupal</button>
                </div>
                <input type="datetime-local" required>
                <textarea placeholder="Notas o enlaces útiles (Drive, Canva, etc.)"></textarea>
                <button type="submit" class="btn-primary">Guardar Tarea</button>
            </form>
    </section>

    <!-- Navegación Inferior fija -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-view="view-tasks">
            <span class="nav-icon">📋</span>
            <span class="nav-label">Tareas</span>
        </button>
        <button class="nav-item" data-view="view-courses">
            <span class="nav-icon">📚</span>
            <span class="nav-label">Cursos</span>
        </button>
        <button class="nav-item" data-view="view-profile">
            <span class="nav-icon">👤</span>
            <span class="nav-label">Cuenta</span>
        </button>
    </nav>

    <!-- Conexión al archivo JS -->
    <script src="JS/almacen.js"></script>
    <script src="JS/cursos.js"></script>
    <script src="JS/tareas.js"></script>
    <script src="JS/app.js"></script>
</body>
</html>
