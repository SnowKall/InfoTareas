<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfoTareas</title>

    <!-- Conexión a los archivos CSS -->
    <link rel="stylesheet" href="CSS/main.css">
    <link rel="stylesheet" href="CSS/componentes.css">
    <link rel="stylesheet" href="CSS/views.css">

    <!-- Conexión al Manifesto PWA-->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
</head>
<body>

    <!-- Pantalla Principal / Vista de Tareas-->
    <section id="view-tasks" class="view active">
        <!-- Barra Superior: Buscador y Botón Agregar -->
        <header class="top-bar">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" placeholder="Buscar tarea o curso...">
            </div>
            <button id="btn-add-task" class="btn-icon-add">+</button>
        </header>

        <!-- Filtros Rápidos -->
            <div class="filter-tabs">
                <button class="filter-btn active" data-filter="all">Todas</button>
                <button class="filter-btn" data-filter="today">Hoy</button>
                <button class="filter-btn" data-filter="week">Esta semana</button>
            </div>

        <!-- Lista de Tareas (Tarjetas) -->
        <main class="tasks-container" id="tasks-list">
        </main>
    </section>

    <!-- Pantalla 2 : Creación de Tareas-->
    <section id="view-add-task" class="view hidden">
        <header class="top-bar-sub">
        <button id="btn-back-task" class="btn-back">←</button>
        <h2>Agregar Tarea</h2>
        </header>
            <form id="form-task" class="form-container">
                <input type="text" placeholder="Título de la tarea" required>
                <select required>
                    <option value="" disabled selected>Selecciona un curso</option>
                </select>
                <div class="type-selector">
                    <button type="button" class="btn-toggle active">Individual</button>
                    <button type="button" class="btn-toggle">Grupal</button>
                </div>
                <input type="datetime-local" required>
                <textarea placeholder="Notas o enlaces útiles (Drive, Canva, etc.)"></textarea>
                <button type="submit" class="btn-primary">Guardar Tarea</button>
            </form>
    </section>

    <!-- Pantalla 3 : Mis cursos y grupos-->
    <section id="view-courses" class="view hidden">
        <header class="top-bar-sub">
            <h2>Mis Cursos y Grupos</h2>
            <button id="btn-add-course" class="btn-icon-add">+</button>
        </header>

        <div class="courses-list" id="courses-list">
            <!-- Los cursos registrados se cargarán aquí dinámicamente -->
            <p style="text-align:center; color: var(--text-secondary); margin-top:20px;">
                Aún no has registrado cursos. Usa el botón + para agregar uno.
            </p>
        </div>
    </section>

    <!-- Pantalla 4 : Agregar curso-->
    <section id="view-add-course" class="view hidden">
        <header class="top-bar-sub">
            <button id="btn-back-course" class="btn-back">←</button>
        <h2>Agregar Curso</h2>
        </header>
        <form id="form-course" class="form-container">
            <input type="text" id="course-name" placeholder="Nombre del curso (Ej. Algoritmos)" required>
            <input type="text" id="course-prof" placeholder="Nombre del profesor">
            
            <div class="group-toggle-box">
                <label style="font-size: 14px; font-weight: 500;">¿Es trabajo grupal en este curso?</label>
                <select id="course-has-group">
                    <option value="no">No (Individual)</option>
                    <option value="si">Sí (Con grupo)</option>
                </select>
            </div>

            <div id="group-fields" class="hidden">
                <h4 style="margin-top:10px; font-size:14px; color: var(--primary-color);">Integrantes del Grupo</h4>
                <textarea id="group-members" placeholder="Escribe los nombres y teléfonos de tu equipo (Ej. Juan: 987654321, Maria: Líder)"></textarea>
            </div>

            <input type="url" id="course-link" placeholder="Link de Drive / Aula Virtual (Opcional)">
            <button type="submit" class="btn-primary">Guardar Curso</button>
        </form>
    </section>

    <!-- Pantall 5 : Mi cuenta / Configuración-->
    <section id="view-profile" class="view hidden">
        <header class="top-bar-sub">
            <h2>Mi Cuenta y Ajustes</h2>
        </header>
        <div class="profile-card" style="background: var(--card-bg); padding: 16px; border-radius: 12px; border: 1px solid var(--border-color);">
            <h3>📱 Estado PWA</h3>
            <p style="font-size: 13px; color: var(--text-secondary); margin: 8px 0;">
                Puedes instalar esta app en tu pantalla de inicio desde las opciones de tu navegador.
            </p>
            <button id="btn-install-pwa" class="btn-primary" style="width: 100%; margin-top: 10px;">Instalar App</button>
        </div>
    </section>

    <!-- Navegación Inferior fija -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-view="view-tasks">
            <span class="nav-icon">📋</span>
            <span class="nav-label">Tareas</span>
        </button>
        <button class="nav-item" data-view="view-courses">
            <span class="nav-icon">📚</span>
            <span class="nav-label">Cursos</span>
        </button>
        <button class="nav-item" data-view="view-profile">
            <span class="nav-icon">👤</span>
            <span class="nav-label">Cuenta</span>
        </button>
    </nav>

    <!-- Conexión al archivo JS -->
    <script src="JS/almacen.js"></script>
    <script src="JS/cursos.js"></script>
    <script src="JS/tareas.js"></script>
    <script src="JS/app.js"></script>
</body>
</html>
